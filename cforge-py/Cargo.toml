[package]
name = "cforge-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for CleitonForge quantum simulator benchmarking"

[lib]
name = "cleitonforge"
crate-type = ["cdylib"]

[dependencies]
# abi3-py38: one wheel per platform that works on every Python from 3.8 up.
# Without it maturin builds against whatever interpreter the runner happens
# to ship, which is how four releases in a row died on a macOS image that
# had moved to a Python newer than PyO3 supports.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
cforge-core     = { path = "../cforge-core" }
cforge-backends = { path = "../cforge-backends", default-features = false }
cforge-metrics  = { path = "../cforge-metrics" }
cforge-parser   = { path = "../cforge-parser" }
